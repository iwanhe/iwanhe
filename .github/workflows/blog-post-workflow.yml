# Mengisi bagian "Latest articles" di README profil secara otomatis dari RSS Medium.

name: Latest Medium articles

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari 00:00 UTC (07:00 WIB)
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest articles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@iwan.herdian86"
          max_post_count: 5
